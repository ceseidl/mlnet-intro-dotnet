name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --nologo

      - name: Smoke test (train, evaluate, save, load, predict)
        run: |
          out=$(dotnet run --project src/SentimentoMl --no-build)
          echo "$out"
          echo "$out" | grep -F 'Accuracy:'
          echo "$out" | grep -F 'Chegou ontem -> negativo'
